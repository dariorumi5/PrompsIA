<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tierlist Kpop — Landing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Kpop</h1>
    <p class="subtitle">Haz click en cada grupo para ver integrantes</p>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Mis 4 grupos de K-Pop favoritos</h2>
      <p>Explora cada grupo y conoce a sus integrantes. Arrastra para rankear en el Tier.</p>
    </section>

    <div class="btn-container">
      <button class="btn-tierlist" onclick="document.getElementById('tierlist-section').scrollIntoView({behavior:'smooth'})">Ir a Tierlist →</button>
    </div>

    <section class="groups-grid" id="groupsGrid">
      <!-- Populated by JS -->
    </section>

    <section class="members-container" id="membersContainer">
      <!-- Populated by JS -->
    </section>

    <section class="tierlist" id="tierlist-section">
      <h3>Tier Ranking (Arrastra para cambiar posición)</h3>
      <div class="tier-headers">
        <div class="tier-label">S</div>
        <div class="tier-label">A</div>
        <div class="tier-label">B</div>
        <div class="tier-label">C</div>
      </div>

      <div class="tiers">
        <div class="tier" data-tier="S"></div>
        <div class="tier" data-tier="A"></div>
        <div class="tier" data-tier="B"></div>
        <div class="tier" data-tier="C"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <small>Landing responsive — HTML, CSS, JS vanilla.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
